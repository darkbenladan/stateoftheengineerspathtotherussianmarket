---
name: GitHub Pages

'on':
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout

      - uses: actions/setup-node
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build -- --base /stateoftheengineerspathtotherussianmarket/

      - uses: actions/configure-pages

      - uses: actions/upload-pages-artifact
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages